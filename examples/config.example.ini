; 复制到 ~/.config/remote-dispatch/config.ini（或用环境变量 RD_CONFIG 指到别处）。
; 注释必须单独成行：rdispatch 不识别行尾注释。取消下面某行注释时，删掉值后面的 ; 说明，否则说明会成为值的一部分。

[defaults]
; 这里的值对所有机器生效，单台机器的小节可以覆盖。
; workdir = ~/remote-dispatch        ; 远端存放仓库、worktree 和日志的目录
; sync = origin                      ; origin：经仓库的 origin 同步；direct：经 SSH 直接同步
; launcher = nohup                   ; nohup 或 tmux
; timeout = 3600                     ; 单个任务的时限（秒）
; 没有会话数上限：一台机器能接几个任务由下面的负载指标决定，不达标就不派
; max_heavy = 1                      ; 同时运行的重命令数（rd-heavy / --heavy）
; max_load_per_core = 1.5            ; 1 分钟负载除以核数超过它就不派
; min_free_mem_pct = 10              ; 空闲内存百分比低于它就不派
; min_free_disk_gb = 10              ; 可用磁盘低于它就不派
; 警告点只影响显示，不拦派单或续跑；以下为缺省值，可在 [host:名称] 覆盖。
; 每核负载达到警告点；内存／磁盘空闲量降到警告点时提示警告。
; warn_load_per_core = 1.0
; warn_free_mem_pct = 20
; warn_free_disk_gb = 20
; 交换区不再参与接单判定（swap 读数仍显示在 hosts/看板/serve 指标）；下面三项已停用，保留加载仅为兼容旧配置
; max_swap_io_mb_s = 10             ; 采样 3 秒的换入+换出速率超过它（MB/s）；已停用
; min_swap_free_gb = 1              ; 交换区剩余低于它（GB）且换页达到 swap_active_mb_s ；已停用
; swap_active_mb_s = 1              ; 视为“正在换页”的速率下限（MB/s）；已停用
; max_swap_used_gb = 15             ; 已用交换空间超过它（GB）只在 hosts/run 输出里提示，不拦
; network_urls = https://pypi.org   ; 必需 HTTPS 地址，逗号/空白分隔；始终追加当前模型服务
; network_model_url =              ; 覆盖模型地址；默认读远端员工活动 provider，再用公开默认地址
; network_websocket_url =          ; Codex HTTPS/WSS TLS 检查地址覆盖；默认按模型地址推导
; network_timeout_seconds = 5       ; 全部外网探测并行共享的超时；RD_NETWORK_* 环境变量优先
; platform = posix                  ; macos/linux/posix/windows；Windows 必须单独设置
; python = python                   ; Windows Python 可执行文件；POSIX 员工配置使用 python3
; max_cpu_pct = 85                   ; Windows CPU 采样上限，不能与 Unix load average 混用
; Windows 用 CPU 百分比警告点，达到时提示警告；缺省 70。
; warn_cpu_pct = 70
; path = $HOME/.local/bin:$HOME/.kimi-code/bin:/opt/homebrew/bin:/usr/local/bin
; ssh_opts = -o BatchMode=yes -o ConnectTimeout=8

[monitor]
; 发起方统一巡检周期（秒），默认15分钟；RD_REPORT_INTERVAL_SECONDS优先。
report_interval_seconds = 900
; 只有网络重连输出、无其他进展达到此时长时 watch 退出1，提示检查网络，不停止任务。
; RD_NETWORK_STALL_SECONDS 优先；跨多次 watch 保存观察计时。
network_stall_seconds = 600

[retention]
; rdispatch clean --expired 的保留期（小时），从最后一次回执确认算起；RD_RETAIN_<KIND>_HOURS 优先。
; 命令任务不能续跑，确认后即回收
; command_hours = 0
; 代理任务已合入或无新提交
; accepted_hours = 24
; 代理任务已取回未合入，最可能续跑
; unmerged_hours = 168

[recovery]
; 同类模型故障且未开始工作时，允许的原会话续跑次数；环境变量优先。
max_same_failure_resumes = 1

[host:mini]
ssh = user@worker.example.invalid
; tags = docker,arm64                ; 配合 rdispatch run --tag 筛选机器
; env_file = ~/.config/remote-dispatch/env   ; 远端文件，任务启动前加载
; codex_auth_file = ~/.codex/auth.json     ; 仅在管理员明确批准共用登录时指定；不自动使用
; enabled = false                    ; 暂时不参与自动选择

; RD_USER_ID 在员工派单端环境变量中设置，不放在共享机器默认配置里。
; Codex 个人配置包：RD_PROFILE_DIR 或 ~/.config/remote-dispatch/profiles/<ID>/。
; workdir 下自动分成 users/<ID>/{profiles,repos,wt,jobs}；locks 在机器级共用。

[host:self]
; 本机目标：另起一个隔离会话，不经过 SSH；只支持 POSIX。
enabled = false
ssh = local
workdir = ~/remote-dispatch-self
sync = direct
; dsh_auth_file = ~/.dsh/.credentials.yaml   ; 本机派 dsh 时必填
; 派 agy 用的目标机登录凭据，下面是默认值；目标机先运行 agy 登录
; agy_auth_file = ~/.gemini/antigravity-cli/antigravity-oauth-token

[host:windows-example]
enabled = false
ssh = worker@windows-host
platform = windows
python = C:/Python312/python.exe
workdir = C:/rd
sync = direct
; path = C:/Program Files/Git/cmd;C:/Python312;%APPDATA%/npm
; env_file = C:/worker-private/api-env.json
; codex_auth_file = C:/Users/worker/.codex/auth.json

; 小节名是 origin 地址里的仓库名。
[project:myrepo]
setup = npm ci
test = npm test
; setup_windows = npm ci            ; 不同命令时按 PowerShell 语法填写
; test_windows = npm test
; test_heavy = false
; origin_url = git@github.com:me/myrepo.git   ; 远端访问仓库的地址和本机不同时才写
; fingerprint = node -v; sha256sum package-lock.json   ; 派单前比较本机与目标机 stdout，不一致则拒绝
; fingerprint_windows = node -v            ; Windows 目标优先用，PowerShell 语法；输出须与本机 fingerprint 一致
; fingerprint_timeout = 120                  ; 指纹命令超时秒数，默认 120

; 覆盖或新增代理，见 docs/agents.md。
; [agent:codex]
; start = codex exec -C "$RD_WT" -s workspace-write -c approval_policy=never --json {model_args} - < "$RD_PROMPT"
