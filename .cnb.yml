main:
  push:
    - docker:
        image: python:3.11
      stages:
        - name: 安装系统工具
          script: apt-get update && apt-get install -y --no-install-recommends git openssh-client rsync lsof tmux openssl
        - name: 安装包
          script: "python -m pip install -e ."
        - name: 创建普通测试用户
          script: useradd --create-home runner && chown -R runner:runner "$PWD"
        - name: 完整测试
          script: "runuser -u runner -- env NO_PROXY=* no_proxy=* PYTHONUTF8=1 timeout 1800 python -m unittest discover -v -s tests -p 'test_*.py'"
